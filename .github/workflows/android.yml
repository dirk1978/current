# Builds the generic Android app (it asks for a server on first run, or scan the Connect phone QR code) and
# attaches it to a GitHub release. Runs when a version tag is pushed: git tag v1.0.0 && git push origin v1.0.0
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the release signing key, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
# Always sign with the same key: Android only installs an update over an app signed with the same key.
name: Android app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets first"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in [0-9]*) ;; *) VERSION=dev-$(git rev-parse --short HEAD);; esac
          VERSION=$VERSION ./android/build.sh --generic
          cp android/current.apk Current.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Current.apk --title "Current $GITHUB_REF_NAME" --generate-notes
      - name: Keep the APK (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: Current.apk
          path: Current.apk
